# The fit of the laws, on a GitHub runner. The fit of the laws of a plan takes minutes, thus only CI starts it.
#
# A person starts it with the ids of Lab runs (lab.yml). The job downloads the artifacts lab-* of each run: the records,
# the raw results and the manifest timed.json of each job. It keeps the records and the manifests only. The command
# laws.main.ts fits the laws of each plan with a law set. The jobs of the check floor give the noise of each law. The job uploads the law files as the artifact laws-<run>.
# Then a person puts the files in a pull request. For example:
#     gh workflow run laws.yml -R mark1russell7/capacity -f runs='<lab run> <lab run of the plan floor>'
#     gh run download <laws run> -R mark1russell7/capacity -n laws-<laws run> -D packages/capacity/laws
name: Laws

on:
  workflow_dispatch:
    inputs:
      runs:
        description: The ids of the Lab runs, separated by spaces. Their records give the laws and the noise floors.
        type: string
        required: true
      bootstrap:
        description: The count of the bootstrap runs of each fit.
        type: string
        default: "1000"

permissions:
  contents: read

# The same Lab runs give the same laws. Thus a second dispatch with the same runs waits for the first, and none is cancelled.
concurrency:
  group: laws-${{ inputs.runs }}
  cancel-in-progress: false

jobs:
  laws:
    runs-on: ubuntu-latest
    # the fits of the laws of a plan on two or three CPU models, each with its bootstrap runs
    timeout-minutes: 120
    permissions:
      contents: read
      # gh run download reads the artifacts of the Lab runs
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each artifact goes into its own folder: records/<run>/<artifact>/timed.json. The fit reads only the manifests and
      # the records. A job of the plan rate has approximately 3 GB of raw results. Thus the step deletes the results of
      # each artifact before it downloads the next, and the disk holds the results of one job at most.
      - name: The records of the Lab runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          RECORDS: ${{ runner.temp }}/records
        run: |
          for run in $RUNS; do
            if [[ ! "$run" =~ ^[0-9]+$ ]]; then
              echo "The run id \"$run\" is not a number." >&2
              exit 1
            fi
            names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select((.name | startswith("lab-")) and (.expired | not)) | .name')
            if [ -z "$names" ]; then
              echo "The Lab run $run has no artifact lab-* that is not expired." >&2
              exit 1
            fi
            for name in $names; do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RECORDS/$run/$name"
              find "$RECORDS/$run/$name" -name '*.result.json' -type f -delete
            done
            echo "The Lab run $run: $(echo "$names" | wc -l) artifacts, $(du -sh "$RECORDS/$run" | cut -f1) of records."
          done
          df -h "$RUNNER_TEMP"
      # A law that the records do not give, or no law, fails the step. The summary tells each problem.
      # A known problem (the field `known` of a measure of the plan) does not fail the step. The summary tells it with its item.
      - name: The fit of the laws
        env:
          RECORDS: ${{ runner.temp }}/records
          OUT: ${{ runner.temp }}/laws
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: node packages/lab/src/laws.main.ts fit --records "$RECORDS" --out "$OUT" --runs "$BOOTSTRAP"
      - name: The law files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laws-${{ github.run_id }}
          path: ${{ runner.temp }}/laws
          if-no-files-found: warn
