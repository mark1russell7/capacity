# The timed runs of the lab, on GitHub's runners. Only CI starts a timed run: the lab needs Docker, privileged containers
# and a machine with no other load. A plan (packages/lab/plans/<id>.json) is a set of cases that one job measures on one
# runner, and the check of their records.
#
# - Each night, the schedule starts each plan with the trigger "schedule".
# - A pull request that changes the lab, the model, the lockfile or this file starts each plan with the trigger
#   "pull_request". A push of such a change to main does the same.
# - A person starts plans by hand. For example, 5 runs of the plan control, each on its own runner, 3 at once:
#     gh workflow run lab.yml -R mark1russell7/capacity --ref <branch> -f plans=control -f runs='[1,2,3,4,5]'
#
# The job plan reads and examines each plan file. It gives the matrix: one job for each run of each plan, with the time
# limit of the plan. With no runs, a plan has its count of jobs (the field jobs, 1 by default). Each job measures its
# plan, and writes the CPU model and the verdict of the check into its summary. It uploads the records, the raw results
# and the manifest timed.json as the artifact lab-<plan>-<run>-<attempt>.
#
# The job gate starts when the run has a gate plan (the field gate). It reads the records of each job of the run and
# compares them with the laws of the plan of the laws (gate.main.ts). A gate that does not give the outcome that its plan
# expects fails the job. A gate with no read fails the job too: no read is not a pass.
name: Lab

on:
  workflow_dispatch:
    inputs:
      plans:
        description: The ids of the plans, separated by commas. Empty starts each plan with the trigger pull_request.
        type: string
        default: ""
      runs:
        description: The numbers of the runs, as a JSON list. Each run of each plan is a job on its own runner. Empty gives each plan its count of jobs.
        type: string
        default: ""
  schedule:
    # each night at 06:22 UTC: the rule runner-budget gives the minute of this repository and file
    - cron: "22 6 * * *"
  # Each pull request starts this workflow. Thus the summary check of the gate is always present. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab.yml"
      - "packages/lab/**"
      - "packages/capacity/src/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

# A pull request shares a group with the later workflows of its ref. A later one cancels an earlier one. Each other run
# has its own group: a dispatch, a schedule and a push to main cancel nothing.
concurrency:
  group: lab-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@a456a3a088d2bf443f2bce9ac0dc0041e827a1de # main
        with:
          paths: |
            .github/workflows/lab.yml
            packages/lab/**
            packages/capacity/src/**
            pnpm-lock.yaml

  plan:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A plan file with a problem, an unknown id and a selection with no plan stop the run here
      - id: plan
        name: The plans of the run
        env:
          EVENT: ${{ github.event_name }}
          PLANS: ${{ inputs.plans }}
          RUNS: ${{ inputs.runs }}
        run: |
          matrix=$(node packages/lab/src/timed.main.ts plan --event "$EVENT" --plans "$PLANS" --runs "$RUNS")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          gates=$(node packages/lab/src/timed.main.ts gates --event "$EVENT" --plans "$PLANS")
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

  lab:
    needs: plan
    strategy:
      # each run gives its records, also when another run fails
      fail-fast: false
      # the convention of the shared runners: at most 3 jobs of a matrix at once
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # the subject has the first CPUs, and the driver and the reader have the others: this runner has 4 CPUs
    runs-on: ubuntu-24.04
    # the setup, the build of the image of the harness, and the longest window of each run of the plan (planMinutes)
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A start case models the memory and the swap of a target. Its check child stops the case when the runner cannot model them.
      - name: The memory and the swap of the runner
        run: |
          free -b
          swapon --show
          docker info --format 'cgroup {{.CgroupVersion}}, memory limit {{.MemoryLimit}}, swap limit {{.SwapLimit}}'
      # The image of the harness builds once, in the first case. A verdict with a problem fails the step.
      - name: The timed run of the plan
        env:
          PLAN: ${{ matrix.plan }}
          RUN: ${{ matrix.run }}
          OUT: ${{ runner.temp }}/lab-records
        run: node packages/lab/src/timed.main.ts measure --plan "$PLAN" --out "$OUT" --run "$RUN"
      - name: The records of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ matrix.plan }}-${{ matrix.run }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-records
          if-no-files-found: warn

  gate:
    needs: [plan, lab]
    # also after a job that failed: a job with a problem is a job that no law reads, and the summary tells it
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.gates != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # each artifact of a job of a gate plan, in its own folder: the id of a gate plan starts with gate- (GATE_PREFIX)
      - name: The records of the gate plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-gate-*
          path: ${{ runner.temp }}/gate-records
      - name: The gate of the laws
        env:
          RECORDS: ${{ runner.temp }}/gate-records
        run: node packages/lab/src/gate.main.ts --records "$RECORDS"

  lab-ok:
    name: Lab OK
    if: ${{ !cancelled() }}
    needs: [changes, plan, lab, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@a456a3a088d2bf443f2bce9ac0dc0041e827a1de # main
        with:
          needs: ${{ toJSON(needs) }}
