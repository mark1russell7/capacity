# The timed runs of the lab, on GitHub's runners. Only CI starts a timed run: the lab needs Docker, privileged containers
# and a machine with no other load. A plan (packages/lab/plans/<id>.json) is a set of cases that one job measures on one
# runner, and the check of their records.
#
# - Each night, the schedule starts each plan with the trigger "schedule".
# - A pull request that changes the lab, the model, the laws, the lockfile or this file starts each plan with the trigger
#   "pull_request". A push of such a change to main does the same.
# - The gate plan gate-rate has the trigger "pull_request" too (CAP-60). A pull request starts it only when it changes a
#   file of the gate: the subject, the harness (its version is in the lockfile), the laws or the gate. The step gate of
#   the job changes gives that answer.
# - A person starts plans by hand. For example, 5 runs of the plan control, each on its own runner, 3 at once:
#     gh workflow run lab.yml -R mark1russell7/capacity --ref <branch> -f plans=control -f runs='[1,2,3,4,5]'
#
# The job plan reads and examines each plan file. It gives the matrix: one job for each run of each plan, with the time
# limit of the plan. With no runs, a plan has its count of jobs (the field jobs, 1 by default). Each job measures its
# plan, and writes the CPU model and the verdict of the check into its summary. It uploads the records, the raw results
# and the manifest timed.json as the artifact lab-<plan>-<run>-<attempt>.
#
# The job gate starts when the run has a gate plan (the field gate). It reads the records of each job of the run and
# compares them with the laws of the plan of the laws (gate.main.ts). A gate that does not give the outcome that its plan
# expects fails the job. A gate with no read fails the job too: no read is not a pass. A gate plan has 13 jobs: a runner
# gets its CPU model at random, and 13 jobs give 2 jobs on the CPU model with laws 99 times in 100 (gateJobsFor).
#
# The bench of the scale query times the head against its base commit, one job for each case (bench-scale.main.ts). A pull
# request always starts it. Its gate, the job bench-gate, fails when a case takes more than 1.1 times the time of the base,
# when a case is too noisy to decide, or when a case has no record. For example, one run of the bench only:
#     gh workflow run lab.yml -R mark1russell7/capacity --ref <branch> -f bench=only
name: Lab

on:
  workflow_dispatch:
    inputs:
      plans:
        description: The ids of the plans, separated by commas. Empty starts each plan with the trigger pull_request.
        type: string
        default: ""
      runs:
        description: The numbers of the runs, as a JSON list. Each run of each plan is a job on its own runner. Empty gives each plan its count of jobs.
        type: string
        default: ""
      bench:
        description: The bench of the scale query. "with" starts it with the plans, "only" starts only the bench, and "none" starts no bench.
        type: choice
        options: [with, only, none]
        default: with
      base:
        description: The base commit of the bench. Empty gives origin/main.
        type: string
        default: ""
  schedule:
    # each night at 06:22 UTC: the rule runner-budget gives the minute of this repository and file
    - cron: "22 6 * * *"
  # Each pull request starts this workflow. Thus the summary check of the gate is always present. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab.yml"
      - "packages/lab/**"
      - "packages/capacity/src/**"
      - "packages/capacity/laws/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

# A pull request shares a group with the later workflows of its ref. A later one cancels an earlier one. Each other run
# has its own group: a dispatch, a schedule and a push to main cancel nothing.
concurrency:
  group: lab-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
      gate: ${{ steps.gate.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
        with:
          paths: |
            .github/workflows/lab.yml
            packages/lab/**
            packages/capacity/src/**
            packages/capacity/laws/**
            pnpm-lock.yaml
      # The files of the gate plans: the subject and the cell (packages/lab/src), the harness (its version is in the
      # lockfile and in the package file of the lab), the laws and their plans, and the gate of the model. Each path is
      # also a path of the step changes. A schedule, a push and a dispatch give a match.
      - id: gate
        uses: mark1russell7/template/.github/actions/changes@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
        with:
          paths: |
            .github/workflows/lab.yml
            pnpm-lock.yaml
            packages/lab/package.json
            packages/lab/src/**
            !packages/lab/src/**/*.test.ts
            packages/lab/plans/floor.json
            packages/lab/plans/rate.json
            packages/lab/plans/gate-*.json
            packages/capacity/laws/**
            packages/capacity/src/**
            !packages/capacity/src/**/*.test.ts

  plan:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gates: ${{ steps.plan.outputs.gates }}
      bench: ${{ steps.plan.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A plan file with a problem, an unknown id and a selection with no plan stop the run here.
      # A pull request always gets the plans and the bench. A dispatch with bench "only" gets no plan.
      # A pull request that changes no file of the gate gets no gate plan (GATES is false).
      - id: plan
        name: The plans of the run
        env:
          EVENT: ${{ github.event_name }}
          PLANS: ${{ inputs.plans }}
          RUNS: ${{ inputs.runs }}
          BENCH: ${{ inputs.bench }}
          GATES: ${{ needs.changes.outputs.gate }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$BENCH" = "only" ]; then
            matrix='[]'
            gates='[]'
          else
            matrix=$(node packages/lab/src/timed.main.ts plan --event "$EVENT" --plans "$PLANS" --runs "$RUNS" --gates "$GATES")
            gates=$(node packages/lab/src/timed.main.ts gates --event "$EVENT" --plans "$PLANS" --gates "$GATES")
          fi
          if [ "$EVENT" = "pull_request" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$BENCH" != "none" ]; }; then
            bench=$(node packages/lab/src/bench-scale.main.ts cases)
          else
            bench='[]'
          fi
          if [ "$EVENT" = "pull_request" ] && { [ "$matrix" = "[]" ] || [ "$bench" = "[]" ]; }; then
            echo "::error::A pull request needs each plan and the bench. The plan of the run is empty."
            exit 1
          fi
          echo "$matrix"
          echo "$bench"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

  lab:
    needs: plan
    # a dispatch of the bench only has no plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      # each run gives its records, also when another run fails
      fail-fast: false
      # the convention of the shared runners: at most 3 jobs of a matrix at once
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # the subject has the first CPUs, and the driver and the reader have the others: this runner has 4 CPUs
    runs-on: ubuntu-24.04
    # the setup, the build of the image of the harness, and the longest window of each run of the plan (planMinutes)
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some runners have no swap. The check child of a start case refuses a host with less swap than its target (matrix.swap).
      - name: The swap of the targets of the plan
        if: ${{ matrix.swap > 0 }}
        env:
          SWAP: ${{ matrix.swap }}
        run: |
          have=$(awk '/^SwapTotal:/ { print $2 * 1024 }' /proc/meminfo)
          if [ "$have" -lt "$SWAP" ]; then
            # the header of a swap file takes one page, thus the file has 1 MiB more
            add=$(( (SWAP - have + 1048575) / 1048576 + 1 ))
            sudo fallocate -l "${add}M" /lab.swap
            sudo chmod 600 /lab.swap
            sudo mkswap /lab.swap
            sudo swapon /lab.swap
          fi
      # A start case models the memory and the swap of a target. Its check child stops the case when the runner cannot model them.
      - name: The memory and the swap of the runner
        run: |
          free -b
          swapon --show
          docker info --format 'cgroup {{.CgroupVersion}}, memory limit {{.MemoryLimit}}, swap limit {{.SwapLimit}}'
      # The image of the harness builds once, in the first case. A verdict with a problem fails the step.
      - name: The timed run of the plan
        env:
          PLAN: ${{ matrix.plan }}
          RUN: ${{ matrix.run }}
          OUT: ${{ runner.temp }}/lab-records
        run: node packages/lab/src/timed.main.ts measure --plan "$PLAN" --out "$OUT" --run "$RUN"
      - name: The records of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ matrix.plan }}-${{ matrix.run }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-records
          if-no-files-found: warn

  gate:
    needs: [plan, lab]
    # also after a job that failed: a job with a problem is a job that no law reads, and the summary tells it
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.gates != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # each artifact of a job of a gate plan, in its own folder: the id of a gate plan starts with gate- (GATE_PREFIX)
      - name: The records of the gate plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-gate-*
          path: ${{ runner.temp }}/gate-records
      - name: The gate of the laws
        env:
          RECORDS: ${{ runner.temp }}/gate-records
        run: node packages/lab/src/gate.main.ts --records "$RECORDS"

  # The bench of the scale query (bench-scale.main.ts): one job for each case. Each round starts a fresh child for the
  # base commit, the head and a second base child, the A/A pair. The job uploads its record as bench-<index>-<attempt>.
  bench:
    needs: plan
    if: needs.plan.outputs.bench != '[]'
    strategy:
      fail-fast: false
      # the convention of the shared runners: at most 3 jobs of a matrix at once
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bench) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # the worktree of the base commit needs the history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The bench of the case
        env:
          CASE: ${{ matrix.case }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/main' }}
          OUT: ${{ runner.temp }}/bench-records
        run: node packages/lab/src/bench-scale.main.ts measure --case "$CASE" --base "$BASE" --out "$OUT"
      - name: The record of the case
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-records
          if-no-files-found: warn

  # The gate of the bench: each case must take at most 1.1 times the time of the base. A noisy case cannot decide, and a
  # case with no record has no read. No read is not a pass: the job bench-again measures these cases again, and the job
  # bench-final decides. A case beyond the limit or a change of value with no reason fails this job.
  bench-gate:
    needs: [plan, bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.bench != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      again: ${{ steps.gate.outputs.again }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The records of the bench
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-[0-9]*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-records
      - name: The gate of the bench
        id: gate
        env:
          RECORDS: ${{ runner.temp }}/bench-records
        run: node packages/lab/src/bench-scale.main.ts gate --records "$RECORDS" --again-out "$GITHUB_OUTPUT"

  # The second try of the cases with no read (CAP-82). A fresh runner measures each case again, because the noise of a
  # runner belongs to its job, and 18 rounds narrow the interval of the noise. Each case still has the verdict of one
  # job, so a noisy job cannot pass.
  bench-again:
    needs: [plan, bench-gate]
    if: ${{ !cancelled() && needs.bench-gate.result == 'success' && needs.bench-gate.outputs.again != '' && needs.bench-gate.outputs.again != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.bench-gate.outputs.again) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # the worktree of the base commit needs the history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The bench of the case
        env:
          CASE: ${{ matrix.case }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/main' }}
          OUT: ${{ runner.temp }}/bench-records
        # three times the 6 rounds of the first try: the interval of the A/A median narrows by the square root of 3
        run: node packages/lab/src/bench-scale.main.ts measure --case "$CASE" --base "$BASE" --out "$OUT" --rounds 18
      - name: The record of the case
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-again-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-records
          if-no-files-found: warn

  # The gate after the second try: the records of the second try replace the records of their cases. This gate decides.
  bench-final:
    needs: [plan, bench-gate, bench-again]
    if: ${{ !cancelled() && needs.bench-gate.result == 'success' && needs.bench-gate.outputs.again != '' && needs.bench-gate.outputs.again != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The records of the first try
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-[0-9]*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-records
      - name: The records of the second try
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-again-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-again
      - name: The gate of the bench after the second try
        env:
          RECORDS: ${{ runner.temp }}/bench-records
          AGAIN: ${{ runner.temp }}/bench-again
        run: node packages/lab/src/bench-scale.main.ts gate --records "$RECORDS" --again "$AGAIN"

  lab-ok:
    name: Lab OK
    if: ${{ !cancelled() }}
    needs: [changes, plan, lab, gate, bench, bench-gate, bench-again, bench-final]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@b00e6c77be906feac2a505888bab26be99d5c4c5 # main
        with:
          needs: ${{ toJSON(needs) }}
          # The job gate starts only for a selection with a gate plan. The job lab skips a dispatch of the bench only, and the
          # bench skips a schedule, a push and a dispatch with no bench. A pull request with no plan or no bench fails the job plan.
          allow-skip: gate lab bench bench-gate bench-again bench-final
